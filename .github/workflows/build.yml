name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (no payload, fast smoke build)
        run: dotnet publish src/OpencodePortable/OpencodePortable.csproj -c Release -r win-x64 -o dist

      - name: Self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/OpencodePortable.exe'
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'self-test failed' }
          foreach ($t in @('--test-robust-delete', '--test-close', '--test-watchdog', '--test-watchdog-proc', '--test-detached')) {
            & $exe $t
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }
          # --test-fallback / --test-watchdog-hop / --test-watchdog-copy need
          # piped stdin or longer waits; covered locally, skipped in CI.
          echo "C:\Windows" | & $exe --test-fallback
          if ($LASTEXITCODE -ne 0) { throw 'test-fallback failed' }

      - name: Secret scan (pack-release, must stay clean)
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/pack-release.ps1 -Out dist-pack
          if ($LASTEXITCODE -ne 0) { throw 'pack-release failed' }

      - name: No runtime artifacts tracked
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '^(data|dist)/|^bin/.+\.exe$|payload/' | ForEach-Object { $_.Line }
          if ($bad) { throw ("tracked runtime artifacts:`n" + ($bad -join "`n")) }
          Write-Host 'tracked files clean.'

      - name: UPSTREAM_VERSION present
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath UPSTREAM_VERSION)) { throw 'UPSTREAM_VERSION missing' }
          $v = (Get-Content -LiteralPath UPSTREAM_VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "UPSTREAM_VERSION malformed: $v" }
          Write-Host "pinned upstream: $v"

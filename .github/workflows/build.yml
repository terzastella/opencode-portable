name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (no payload, fast smoke build)
        run: dotnet publish src/OpencodePortable/OpencodePortable.csproj -c Release -r win-x64 -o dist

      - name: Self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/OpencodePortable.exe'
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'self-test failed' }
          foreach ($t in @('--test-robust-delete', '--test-close', '--test-watchdog', '--test-watchdog-proc', '--test-detached')) {
            & $exe $t
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }
          # --test-fallback / --test-watchdog-hop / --test-watchdog-copy need
          # piped stdin or longer waits; covered locally, skipped in CI.
          echo "C:\Windows" | & $exe --test-fallback
          if ($LASTEXITCODE -ne 0) { throw 'test-fallback failed' }

      - name: Secret scan (pack-release, must stay clean)
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/pack-release.ps1 -Out dist-pack
          if ($LASTEXITCODE -ne 0) { throw 'pack-release failed' }

      - name: No runtime artifacts tracked
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '^(data|dist)/|^bin/.+\.exe$|payload/' | ForEach-Object { $_.Line }
          if ($bad) { throw ("tracked runtime artifacts:`n" + ($bad -join "`n")) }
          Write-Host 'tracked files clean.'

      - name: UPSTREAM_VERSION present
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath UPSTREAM_VERSION)) { throw 'UPSTREAM_VERSION missing' }
          $v = (Get-Content -LiteralPath UPSTREAM_VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "UPSTREAM_VERSION malformed: $v" }
          Write-Host "pinned upstream: $v"

  # Full release-path verification, tags only (slow: downloads ~58MB payload).
  # Fast smoke job above stays green on every push; this proves publish-fat,
  # payload embed + hash assert, extraction and a real run end to end.
  build-fat:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish fat (pinned version, embedded payload)
        shell: pwsh
        run: |
          $v = (Get-Content -LiteralPath UPSTREAM_VERSION -Raw).Trim()
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/publish-fat.ps1 -Version $v

      - name: Payload assert + smoke run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/OpencodePortable.exe'
          & $exe --has-payload
          if ($LASTEXITCODE -ne 0) { throw 'has-payload failed' }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'self-test failed' }
          $ws = Join-Path $env:RUNNER_TEMP 'ci-ws'
          New-Item -ItemType Directory -Path $ws -Force | Out-Null
          Set-Content (Join-Path $ws 'probe.txt') 'ci'
          & $exe --workspace $ws -- --version
          if ($LASTEXITCODE -ne 0) { throw 'fat smoke run failed' }
          $left = Get-ChildItem -LiteralPath $ws -Force | Where-Object { $_.Name -ne 'probe.txt' }
          if ($left) { throw ("workspace not clean: " + ($left.Name -join ', ')) }
          Write-Host 'fat pipeline OK.'
